[project]
name = "fp-int-agents-workspace"
version = "0.1.0"
description = "Textual TUI chat app with uv + LangGraph + LiteLLM workspace"
readme = "README.md"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["apps/chat"]
exclude = ["services/model_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["network: needs model download / live endpoint"]
pythonpath = ["apps/chat/src", "."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
