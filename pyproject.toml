[project]
name = "fp-int-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Elia Doumerc", email = "elia.doumerc@sap.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langgraph>=1.2.11",
    "litellm>=1.96.2",
    "textual>=8.2.8",
]

[project.scripts]
fp-int-agents = "fp_int_agents:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
